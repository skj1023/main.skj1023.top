<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纽约时报 · 21世纪最佳100部电视剧</title>
<style>
  :root{
    --bg:#0d0f14;
    --panel:#151922;
    --panel-2:#1b2029;
    --line:#262c38;
    --text:#e8eaf0;
    --muted:#98a0b3;
    --gold:#f5c518;
    --accent:#5b8cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 50% -10%, #1c2333 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  header.hero{
    padding:64px 0 32px;
    text-align:center;
    border-bottom:1px solid var(--line);
    margin-bottom:28px;
  }
  .kicker{
    display:inline-block;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(245,197,24,.35);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:20px;
  }
  h1{
    margin:0 0 14px;
    font-size:clamp(28px,5vw,46px);
    font-weight:800;
    letter-spacing:-.5px;
    line-height:1.25;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(90deg,#f5c518,#ff9d3d);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{color:var(--muted);max-width:760px;margin:0 auto;font-size:15px}
  .sub a{color:var(--accent)}
  .toolbar{
    position:sticky;top:0;z-index:20;
    background:rgba(13,15,20,.86);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .toolbar .inner{
    max-width:1180px;margin:0 auto;padding:12px 20px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  }
  #q{
    flex:1 1 240px;min-width:180px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 14px;font-size:14px;outline:none;
  }
  #q:focus{border-color:var(--accent)}
  #sortsel{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none;
  }
  .count{color:var(--muted);font-size:13px;white-space:nowrap}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:16px;
  }
  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 16px;
    display:flex;flex-direction:column;gap:10px;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:#3a4356;
    box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .top{display:flex;align-items:flex-start;gap:12px}
  .rank{
    flex:none;
    width:38px;height:38px;
    display:grid;place-items:center;
    border-radius:10px;
    background:rgba(245,197,24,.12);
    border:1px solid rgba(245,197,24,.28);
    color:var(--gold);
    font-weight:800;font-size:15px;
    font-variant-numeric:tabular-nums;
  }
  .titles{min-width:0}
  .zh{
    font-size:17px;font-weight:700;line-height:1.4;
    overflow-wrap:anywhere;
  }
  .en{
    color:var(--muted);font-size:12.5px;line-height:1.4;
    overflow-wrap:anywhere;
  }
  .desc{font-size:14px;color:#c9cfdd;margin:0}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
  .tag{
    font-size:11.5px;color:var(--muted);
    background:#11151d;border:1px solid var(--line);
    border-radius:999px;padding:3px 9px;
  }
  .years{font-variant-numeric:tabular-nums}
  .imdb{
    display:inline-flex;align-items:center;gap:6px;
    text-decoration:none;
    background:var(--gold);color:#111;
    font-weight:800;font-size:13px;
    padding:5px 11px;border-radius:8px;
    margin-left:auto;white-space:nowrap;
  }
  .imdb:hover{filter:brightness(1.1)}
  .imdb.none{background:#2a3040;color:var(--muted);font-weight:600}
  footer{
    margin-top:48px;padding-top:24px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12.5px;
  }
  footer a{color:var(--accent)}
  @media (max-width:520px){
    .grid{grid-template-columns:1fr}
    header.hero{padding:40px 0 24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="kicker">The New York Times</span>
    <h1>21 世纪最佳 <em>100 部电视剧</em></h1>
    <p class="sub">
      《纽约时报》邀请 516 位演员、编剧、导演与制片人投票选出自己最爱的 10 部 2000 年之后首播的剧集，
      再经两两对决排出名次（《黑道家族》因 1999 年首播未参评）。
      下列卡片为完整榜单，附中文简介与 IMDb 评分、链接。
    </p>
  </header>

  <div class="toolbar">
    <div class="inner">
      <input id="q" type="search" placeholder="搜索剧名 / 类型 / 年份，例如：罪案、2019、科幻">
      <select id="sortsel">
        <option value="rank">按榜单排名</option>
        <option value="rating">按 IMDb 评分</option>
        <option value="years">按首播年份</option>
      </select>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    数据来源：The New York Times “100 Best TV Shows of the 21st Century”（2026-09-25）；
    IMDb 评分取自 <a href="https://www.imdb.com/" target="_blank" rel="noopener">IMDb</a>，评分为采集时刻的即时值，可能随时间变动。
  </footer>
</div>

<script>

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const sortsel = document.getElementById('sortsel');
const count = document.getElementById('count');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function card(s){
  const has = s.tt && s.rating;
  const href = s.tt ? `https://www.imdb.com/title/${encodeURIComponent(s.tt)}/` : null;
  const rate = has
    ? `<a class="imdb" href="${href}" target="_blank" rel="noopener" title="在 IMDb 查看">IMDb ${esc(s.rating)}</a>`
    : (s.tt
        ? `<a class="imdb none" href="${href}" target="_blank" rel="noopener">IMDb 页面</a>`
        : `<span class="imdb none">暂无</span>`);
  const genres = String(s.genres || '').split(',').map(x => x.trim()).filter(Boolean)
    .slice(0,3).map(g => `<span class="tag">${esc(g)}</span>`).join('');
  return `<article class="card" data-search="${esc((s.zh+' '+s.en+' '+s.genres+' '+s.years+' '+s.desc).toLowerCase())}">
    <div class="top">
      <div class="rank">${s.rank}</div>
      <div class="titles">
        <div class="zh">${esc(s.zh)}</div>
        <div class="en">${esc(s.en)}</div>
      </div>
    </div>
    <p class="desc">${esc(s.desc)}</p>
    <div class="meta">
      <span class="tag years">${esc(s.years)}</span>
      ${genres}
      ${rate}
    </div>
  </article>`;
}

const yearOf = s => parseInt(String(s.years).match(/\d{4}/)?.[0] || '9999', 10);

function render(){
  const kw = q.value.trim().toLowerCase();
  let list = SHOWS.filter(s => !kw || String(s.__s).includes(kw));
  const mode = sortsel.value;
  if (mode === 'rating') list = list.slice().sort((a,b) => (parseFloat(b.rating)||0) - (parseFloat(a.rating)||0));
  if (mode === 'years')  list = list.slice().sort((a,b) => yearOf(a) - yearOf(b));
  grid.innerHTML = list.map(card).join('') || '<p style="color:var(--muted)">没有匹配的剧集。</p>';
  count.textContent = `共 ${list.length} 部`;
}

SHOWS.forEach(s => s.__s = (s.zh+' '+s.en+' '+s.genres+' '+s.years+' '+s.desc).toLowerCase());
q.addEventListener('input', render);
sortsel.addEventListener('change', render);
render();
</script>
